name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # GitHub's runners have no GPU. Firefox and WebKit cannot rasterise
      # WebGL2 there at all — they timed out screenshotting the canvas — and
      # Chromium only manages it via SwiftShader, about five times slower than
      # hardware. That is fast enough to check the interface and the layout,
      # and not fast enough for anything that waits on a wake to develop: dye
      # brightness, shedding frequency, a recorded clip with real motion in it.
      #
      # So CI runs Chromium minus the @gpu tag, and the tagged tests plus the
      # other two engines are a local gate. See CONTRIBUTING. Testing what the
      # runner can actually verify beats a red badge nobody reads.
      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e:ci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
