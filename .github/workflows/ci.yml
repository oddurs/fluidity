name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Chromium only. GitHub's runners have no GPU: Chromium falls back to
      # SwiftShader and runs the solver fine, but Firefox and WebKit cannot
      # rasterise WebGL2 fast enough to even screenshot the canvas inside 90
      # seconds, so every test that waits on the tank timed out. Those two
      # engines are still verified — locally, with `npm run test:e2e`, before
      # a release. See CONTRIBUTING.
      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e:chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
